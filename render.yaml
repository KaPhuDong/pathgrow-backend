databases:
  - name: pathgrow-db
    databaseName: pathgrow
    user: pathgrow_user

services:
  - type: web
    name: pathgrow-backend
    env: php
    plan: free
    buildCommand: |
      composer install --no-dev --optimize-autoloader
    startCommand: |
      php artisan serve --host 0.0.0.0 --port 10000
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://pathgrow-backend.onrender.com

      # Database config
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: pathgrow-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: pathgrow-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: pathgrow-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: pathgrow-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: pathgrow-db
          property: password

      # Cloudinary (nếu bạn dùng upload ảnh)
      - key: CLOUDINARY_URL
        value: cloudinary://931388216412238:c27Lq9zSSuyMRZW0zOggysoeUQo@dkyirb8pv
      - key: CLOUDINARY_CLOUD_NAME
        value: dkyirb8pv
      - key: CLOUDINARY_API_KEY
        value: 931388216412238
      - key: CLOUDINARY_API_SECRET
        value: c27Lq9zSSuyMRZW0zOggysoeUQo

    postDeploy: |
      php artisan migrate --force
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
