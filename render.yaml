databases:
  - name: pathgrow-db
    databaseName: pathgrow
    user: pathgrow_user

services:
  - type: web
    name: pathgrow-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://pathgrow-backend.onrender.com

      # Database config
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: pathgrow-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: pathgrow-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: pathgrow-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: pathgrow-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: pathgrow-db
          property: password

      # Cloudinary (nếu bạn dùng upload ảnh)
      - key: CLOUDINARY_URL
        value: cloudinary://931388216412238:c27Lq9zSSuyMRZW0zOggysoeUQo@dkyirb8pv
      - key: CLOUDINARY_CLOUD_NAME
        value: dkyirb8pv
      - key: CLOUDINARY_API_KEY
        value: 931388216412238
      - key: CLOUDINARY_API_SECRET
        value: c27Lq9zSSuyMRZW0zOggysoeUQo
